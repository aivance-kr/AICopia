name: CI

# 검증 게이트 정책: feature → dev PR 에는 CI 를 걸지 않는다(로컬 pre-push 훅이 실질 게이트).
# CI 는 dev → main 배포 PR 에서만 돈다. branches 를 비워두면 모든 PR 에서 돌아 정책이
# 무의미해지므로 반드시 main 으로 한정한다. (자세한 배경: .claude/rules/testing.md)
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다 — self-hosted 러너가 1대라
# 중복 실행이 쌓이면 뒤 PR 이 계속 대기한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# self-hosted 러너에서 돈다 — GitHub 호스팅 러너(ubuntu-latest) 결제 문제로 막힌 게 계기.
# 러너는 self-hosted Linux(X64) 머신에 상시 리스닝 서비스로 등록돼 있다.
# (등록 방법·러너 위치는 .claude/rules/testing.md 5번 섹션 참고)
jobs:
  # 품질 게이트 단일 잡 — 스타일·정적 분석·의존성 점검·테스트·커버리지를 한 잡에서 처리한다.
  # 잡을 쪼개면 러너가 1대뿐인 환경에서 checkout·composer install·MySQL 기동이 중복되고,
  # 커버리지를 별도 잡으로 두면 같은 스위트를 한 번 더 돌리게 된다.
  quality:
    name: 코드 스타일 · 정적 분석 · 테스트 · 커버리지
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      pull-requests: write
    env:
      CI_MYSQL_PORT: '13306'
      CI_MYSQL_CONTAINER: aicopia-ci-mysql-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      # PHP 는 러너 머신에 설치된 것을 그대로 쓴다(shivammathur/setup-php 미사용) — 그 액션은
      # self-hosted 러너에서 런타임을 다시 설치·relink 하다 다른 프로젝트 러너와 충돌한다.
      # 대신 전제 조건(버전·커버리지 드라이버)을 여기서 명시적으로 검사해, 러너 환경이
      # 어긋났을 때 뒤쪽 스텝에서 애매하게 실패하지 않고 즉시 원인을 드러내게 한다.
      - name: PHP/Composer 환경 점검
        run: |
          php -v && composer --version
          php -r 'exit(version_compare(PHP_VERSION, "8.5", ">=") ? 0 : 1);' \
            || { echo "::error::composer.json 이 PHP 8.5 이상을 요구한다 (러너: $(php -r 'echo PHP_VERSION;'))"; exit 1; }
          # 커버리지 드라이버가 없으면 커버리지 리포트가 조용히 비어버린다.
          php -r 'exit(extension_loaded("pcov") || extension_loaded("xdebug") ? 0 : 1);' \
            || { echo "::error::커버리지 드라이버가 없다. 러너에 pcov 또는 xdebug 를 설치할 것"; exit 1; }

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # 이 저장소는 표준 CI4 스켈레톤(app/Config 표준 파일·system·spark·env)을 gitignore 한다.
      # vendor 프레임워크에서 없는 항목만 복원한다(커스텀 Config 보존).
      - name: Restore CI4 skeleton
        run: |
          for src in vendor/codeigniter4/framework/app/Config/*; do
            dest="app/Config/$(basename "$src")"
            [ -e "$dest" ] || cp -r "$src" "$dest"
          done
          [ -e system ] || ln -s vendor/codeigniter4/framework/system system
          [ -f spark ] || cp vendor/codeigniter4/framework/spark spark
          mkdir -p writable/cache writable/logs writable/session writable/tmp writable/uploads

      - name: 코드 스타일 검사 (PHP-CS-Fixer)
        run: composer cs

      - name: 정적 분석 (PHPStan)
        run: composer analyse

      - name: 의존성 취약점 점검 (composer audit)
        run: composer audit --no-dev || true

      # MySQL을 docker run으로 직접 기동한다. 러너 호스트에 다른 MySQL 프로세스가 떠 있을 수
      # 있어 충돌을 피하려고 CI 전용 컨테이너는 호스트 포트 13306을 사용한다.
      - name: MySQL 컨테이너 기동
        run: |
          docker rm -f -v "$CI_MYSQL_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$CI_MYSQL_CONTAINER" \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            -e MYSQL_DATABASE=aicopia_test \
            -p "${CI_MYSQL_PORT}:3306" \
            mysql:8.0

      # 마이그레이션은 MySQL 전용 DDL을 쓰므로 SQLite 불가 → MySQL 컨테이너 사용.
      # 테스트는 $DBGroup='tests'($migrate=false)이므로 미리 마이그레이션해야 한다.
      # 마이그레이션이 prefix 없는 raw DDL(`ALTER TABLE users ...`)을 쓰므로 DBPrefix는 빈 값이어야 한다.
      # default·tests 두 그룹을 동일 MySQL DB로 맞춰
      # `php spark migrate`(default)가 테이블을 만들고 테스트(tests)가 그대로 읽게 한다.
      #
      # ⚠️ database.*.DBDriver 를 여기에 쓰면 안 된다.
      # BaseConfig 가 registerProperties() 뒤에 initEnvValue() 를 실행하므로 .env 의
      # DBDriver 가 Config/Registrar.php 의 커스텀 드라이버 등록을 덮어쓴다. 그러면
      # App\Database\MySQLiTimezone\Connection 이 적용되지 않아 커넥션 세션 타임존이
      # SYSTEM 으로 남고, ConvertDatetimeColumnsToTimestamp 마이그레이션이 가드에
      # 걸려 중단되며 DatabaseTimezoneTest 가 실패한다. 드라이버는 Registrar 가 정한다.
      - name: Configure .env (test DB)
        run: |
          cp vendor/codeigniter4/framework/env .env
          {
            echo ""
            echo "CI_ENVIRONMENT = development"
            echo "database.default.hostname = 127.0.0.1"
            echo "database.default.database = aicopia_test"
            echo "database.default.username = root"
            echo "database.default.password ="
            echo "database.default.DBPrefix ="
            echo "database.default.port = ${CI_MYSQL_PORT}"
            echo "database.tests.hostname = 127.0.0.1"
            echo "database.tests.database = aicopia_test"
            echo "database.tests.username = root"
            echo "database.tests.password ="
            echo "database.tests.DBPrefix ="
            echo "database.tests.port = ${CI_MYSQL_PORT}"
          } >> .env

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P "${CI_MYSQL_PORT}" -uroot --silent && break
            sleep 2
          done

      - name: Migrate test DB (템플릿)
        run: php spark migrate --all

      # ParaTest worker(TEST_TOKEN 1..4)별 전용 DB(aicopia_test_1..4)를 템플릿에서 복제.
      # 공유 DB 충돌(하드코딩 unique 값·수동 정리)을 피하려면 worker마다 DB가 분리돼야 한다.
      - name: 병렬 테스트 worker DB 프로비저닝
        run: MYSQL_PWD='' bash bin/clone-test-dbs.sh 4 127.0.0.1 root aicopia_test "${CI_MYSQL_PORT}"

      # 테스트와 커버리지를 한 번에 뽑는다(로컬 실측 43초) — 커버리지를 따로 돌리면
      # 같은 스위트를 두 번 실행하게 된다.
      - name: 단위 테스트 + 커버리지 (ParaTest 병렬)
        run: composer test:coverage

      - name: 커버리지 요약을 잡 서머리에 첨부
        if: always()
        run: |
          if [ -f build/coverage.txt ]; then
            {
              echo '### 📊 커버리지'
              echo '```'
              cat build/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # irongut/CodeCoverageSummary 는 Docker 컨테이너 액션이다. 러너가 Linux 라 액션으로
      # 바로 쓸 수도 있지만, 커버리지 게시는 부가 정보라 실패해도 파이프라인을 막지 않도록
      # continue-on-error 를 건다.
      - name: 커버리지 마크다운 생성
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: build/cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: file
          thresholds: '50 75'

      - name: 커버리지 PR 코멘트
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md

      # self-hosted 러너는 다음 잡·다음 실행에도 같은 디스크를 재사용하므로 컨테이너는 반드시 정리한다.
      - name: MySQL 컨테이너 정리
        if: always()
        run: docker rm -f -v "$CI_MYSQL_CONTAINER" >/dev/null 2>&1 || true

  # Slack 알림 — CI가 실패했을 때만 발송(성공 알림은 노이즈라 생략).
  # SLACK_WEBHOOK_URL 시크릿이 없으면 조용히 건너뛴다(파이프라인에 영향 없음).
  notify:
    name: Slack 알림 (실패 시)
    runs-on: [self-hosted, Linux, X64]
    needs: [quality]
    if: failure()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: CI 실패 알림
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # 커밋 메시지·PR 제목은 따옴표/개행이 들어올 수 있어 toJSON()으로 안전하게 이스케이프한다.
          payload: |
            text: "❌ CI 실패 — ${{ github.repository }} (${{ github.head_ref || github.ref_name }})"
            attachments:
              - color: "#e01e5a"
                blocks:
                  - type: header
                    text:
                      type: plain_text
                      text: "❌ CI 실패 — ${{ github.repository }}"
                      emoji: true
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*브랜치*\n`${{ github.head_ref || github.ref_name }}`"
                      - type: mrkdwn
                        text: "*작성자*\n${{ github.actor }}"
                      - type: mrkdwn
                        text: "*이벤트*\n${{ github.event_name }}"
                      - type: mrkdwn
                        text: "*커밋*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|커밋 보기>"
                      - type: mrkdwn
                        text: "*품질 게이트*\n${{ needs.quality.result == 'success' && '✅ 통과' || needs.quality.result == 'failure' && '❌ 실패' || '⏭️ 취소/건너뜀' }}"
                  - type: section
                    text:
                      type: mrkdwn
                      text: ${{ toJSON(format('>{0}', github.event.pull_request.title || github.event.head_commit.message || '(커밋 메시지 없음)')) }}
                  - type: section
                    text:
                      type: mrkdwn
                      text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔍 실행 로그 보기>${{ github.event_name == 'pull_request' && format(' · <{0}|PR #{1} 보기>', github.event.pull_request.html_url, github.event.pull_request.number) || '' }}"
